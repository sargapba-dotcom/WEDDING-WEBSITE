  <text x="600" y="910" text-anchor="middle" font-family="Georgia, serif" font-size="54" letter-spacing="8" fill="#7b4a90" fill-opacity=".7">ADD PHOTO</text>
  <text x="600" y="980" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" letter-spacing="6" fill="#7b4a90" fill-opacity=".56">PLACEHOLDER</text>
