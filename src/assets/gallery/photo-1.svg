    <path d="M-58 36h116c12 0 21-10 19-22l-14-76c-2-11-12-18-23-18h-18l-17-24c-3-5-9-8-15-8h-20c-6 0-12 3-15 8l-17 24h-18c-11 0-21 7-23 18l-14 76c-2 12 7 22 19 22z" fill="none" stroke="#8b4fa4" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="0" cy="-4" r="24" fill="none" stroke="#8b4fa4" stroke-width="10"/>
    <path d="M-24 38l28-26 18 18 22-18 22 26" fill="none" stroke="#8b4fa4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
