<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Gallery placeholder 1</title>
  <desc id="desc">Lavender themed photo placeholder with a soft frame and add photo text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8f1fa"/>
      <stop offset="55%" stop-color="#ebd8f1"/>
      <stop offset="100%" stop-color="#dcc2e8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <rect width="1200" height="1500" fill="url(#glow)"/>
  <g fill="none" stroke="#9b5fb5" stroke-opacity=".24">
    <path d="M80 350 C240 240 360 220 520 300" stroke-width="12" stroke-linecap="round"/>
    <path d="M1180 1060 C1030 1170 900 1200 740 1130" stroke-width="12" stroke-linecap="round"/>
  </g>
